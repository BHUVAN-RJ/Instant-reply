<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Instant Reply</title>
    <style>
      :root { color-scheme: light dark; --accent: #7c3aed; --muted: #6b7280; --line: #d1d5db; }
      body { font: 13px/1.4 system-ui, sans-serif; width: 280px; margin: 0; padding: 14px; }
      h1 { font-size: 14px; margin: 0 0 12px; }
      label { display: block; font-weight: 600; margin: 10px 0 4px; }
      input { box-sizing: border-box; width: 100%; padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px; font: inherit; background: transparent; color: inherit; }
      .row { display: flex; gap: 8px; margin-top: 12px; }
      button { flex: 1; padding: 7px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: inherit; font: inherit; cursor: pointer; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button:disabled { opacity: 0.6; cursor: default; }
      .hint { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
      #status { margin-top: 10px; min-height: 18px; }
      #status.error { color: #dc2626; }
      #status.ok { color: #16a34a; }
    </style>
  </head>
  <body>
    <h1>Instant Reply</h1>
    <form id="form">
      <label for="key">OpenRouter API key</label>
      <input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="sk-or-..." />
      <p class="hint" id="saved-hint"></p>
      <label for="model">Model</label>
      <input id="model" type="text" spellcheck="false" />
      <div class="row">
        <button type="submit" class="primary" id="save">Save</button>
        <button type="button" id="remove">Remove key</button>
      </div>
      <p id="status"></p>
    </form>
    <p class="hint">Stored only on this computer and sent only to openrouter.ai.</p>
    <div class="row"><button type="button" id="voice">Your voice and prompts</button></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
