<!doctype html>
<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beach mockup</title>
<!-- Snapshot of the shipped Beach theme (npm run mockup:snapshot -- beach). To change the theme,
     add an option with your changes next to "current", compare, get approval, then port it to the pack.
     The Refactor animation is the theme's own code: run it in the preview (npm run preview). -->
<link rel="stylesheet" href="../kit/mockup-kit.css">
<style id="theme-current">
@font-face { font-family: "IR Fredoka"; src: url("../../../apps/extension/public/fonts/fredoka-600.woff2") format("woff2"); font-weight: 600; font-display: swap; }
@font-face { font-family: "IR Pacifico"; src: url("../../../apps/extension/public/fonts/pacifico.woff2") format("woff2"); font-display: swap; }

.ir-active-box { position: relative; isolation: isolate; }
/* The card's own background, radius and shadow are cleared; the skin behind it draws the edge. */
.ir-active-box [data-ir-card] { border-radius: 0 !important; box-shadow: none !important; background: transparent !important; border-color: transparent !important; }
.ir-skin { position: absolute; z-index: -1; pointer-events: none; }
/* In a window the skin fills the box and must not spill past it: Gmail's window scrolls, and anything
   sticking out would add a scrollbar. */
.ir-active-box[data-ir-layout="window"] > .ir-skin { overflow: hidden; }
.ir-toggle-cell { vertical-align: middle; padding: 0 10px 0 6px; white-space: nowrap; }
.ir-toggle, .ir-refactor { cursor: pointer; white-space: nowrap; vertical-align: middle; }
.ir-refactor:disabled { cursor: progress; }
.ir-busy { pointer-events: none; }
.ir-pin { position: absolute; z-index: 9; cursor: pointer; }
.ir-note { position: absolute; z-index: 10; width: 290px; box-sizing: border-box; }
.ir-note textarea { display: block; width: 100%; box-sizing: border-box; border: 0; outline: 0; resize: none; background: transparent; color: inherit; font: 14px/1.4 system-ui, sans-serif; }
.ir-note-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px; }
.ir-note-delete { cursor: pointer; }
.ir-note-delete[hidden] { display: none; }

/* --- tokens --- */

/* Every colour comes from the time of day palette (see variantCss); these are only fallbacks. */
.ir-active-box { --b-leaf: #2e9d6a; --b-ink: #12384a; }
/* --- card --- */

/* Round, with a thin leaf green edge */
.ir-skin > i { position: absolute; }
.ir-skin .ir-card { inset: -2px; border: 2px solid var(--b-leaf); border-radius: 22px; background: var(--ir-paper); }
/* --- head --- */

/* The To line is shallow lagoon water ending in a scalloped foam line above the body */
.ir-skin .ir-lagoon { left: 0; right: 0; top: 0; height: var(--ir-head, 0px); border-radius: 20px 20px 0 0; background: linear-gradient(180deg, var(--b-lt-soft), var(--b-lt-mix)); }
.ir-skin .ir-foam { left: 0; right: 0; top: var(--ir-head, 0px); height: 14px; background: repeat-x 0 0 / 22px 14px; }
.ir-active-box:not([data-ir-layout="window"])[data-ir-head-style="band"] [data-ir-head], .ir-active-box:not([data-ir-layout="window"])[data-ir-head-style="band"] [data-ir-head] * { color: var(--b-ink) !important; background-color: transparent !important; }
/* Without the band (the default, and always in a window under Subject): no water, only the scalloped foam
   line between the To line and the body, like the edge of the shore. */
.ir-active-box[data-ir-head-style="rule"] > .ir-skin .ir-lagoon { display: none; }
.ir-active-box[data-ir-head-style="rule"] > .ir-skin .ir-foam { top: calc(var(--ir-head, 0px) - 6px); }
/* --- body --- */

/* With the To line band, room under the foam line, so the body reads as the beach the wave runs onto */
.ir-active-box:not([data-ir-layout="window"])[data-ir-head-style="band"] [data-ir-card] > table.iN { border-top: 12px solid transparent !important; }
/* With the foam line alone, 12px of room under it */
.ir-active-box[data-ir-head-style="rule"] table.iN { border-top: 12px solid transparent !important; }
/* --- formatBar --- */

/* A lagoon strip with a leaf edge; its buttons bloom on hover */
.ir-active-box .J-Z[role="toolbar"] { background: var(--b-lt-soft) !important; border: 2px solid var(--b-leaf); border-radius: 22px !important; }
.ir-active-box .J-Z[role="toolbar"] .J-Z-axR { background: var(--b-leaf) !important; opacity: .5; }
.ir-active-box .J-Z[role="toolbar"] [role="button"], .ir-active-box .J-Z[role="toolbar"] [role="listbox"] { transition: transform .12s; }
.ir-active-box .J-Z[role="toolbar"] [role="button"]:hover, .ir-active-box .J-Z[role="toolbar"] [role="listbox"]:hover,
.ir-active-box .J-Z[role="toolbar"] [aria-pressed="true"] { background-color: var(--b-flower2) !important; border-radius: 62% 38% 62% 38% / 62% 38% 62% 38% !important; transform: translateY(-1px); }
.ir-active-box .J-Z[role="toolbar"] [role="option"] { font: 600 14px/1.4 "IR Fredoka", "Trebuchet MS", system-ui, sans-serif !important; color: var(--b-ink) !important; }
/* Dark Gmail draws the bar's text light, so the strip turns into a faint lagoon tint instead of pale fill */
.ir-active-box[data-ir-theme="dark"] .J-Z[role="toolbar"] { background: color-mix(in srgb, var(--b-lt) 14%, transparent) !important; }
/* --- pinnedRow --- */

/* Pinned to the window bottom on long replies, the Send row gets the card's leaf edge and round bottom */
.ir-active-box .aDj.ahe { box-shadow: none !important; }
.ir-active-box .aDj.ahe::before { inset: 0 -2px -2px !important; border: 2px solid var(--b-leaf) !important; border-top: 0 !important; border-radius: 0 0 22px 22px !important; }
.ir-active-box .aDj.ahe::after { inset: 0 !important; background: var(--ir-paper) !important; border-radius: 0 0 20px 20px !important; }
/* --- window --- */

/* A new email or a popped out reply: Gmail's window is the frame. The To and Subject rows stay on paper
   in Gmail's colours (they are form fields); where they end, the head slot's foam line marks the shore, and
   a thin leaf edge runs down both inside edges. The switch shrinks to its flower lens and Refactor
   tightens, so Gmail keeps room for its toolbar icons. */
.ir-active-box[data-ir-layout="window"] > .ir-skin .ir-card { inset: 0; border: 0; border-left: 2px solid var(--b-leaf); border-right: 2px solid var(--b-leaf); border-radius: 0; }
.ir-active-box[data-ir-layout="window"] .ir-toggle { width: 44px; padding: 0; font-size: 0; justify-content: center; margin-left: 8px; }
.ir-active-box[data-ir-layout="window"] .ir-toggle::before { left: 50%; margin-left: -11px; }
.ir-active-box[data-ir-layout="window"] .ir-refactor { padding: 1px 30px 0 12px; font-size: 14px; margin-left: 6px; }
.ir-active-box[data-ir-layout="window"] .dC .aoO { padding: 0 16px !important; }
/* --- toggle --- */

/* A lens with a bud that opens into a plumeria when on */
.ir-toggle {
  position: relative; display: inline-flex; align-items: center; height: 36px; padding: 1px 20px 0 38px; margin-left: 10px;
  border: 0; background: transparent center / 100% 100% no-repeat; color: var(--b-leaf-d, #1d6e49);
  font: 600 13px/1 "IR Fredoka", "Trebuchet MS", system-ui, sans-serif; transition: transform .15s;
}
.ir-toggle:hover { transform: translateY(-1px) rotate(-1deg); }
.ir-toggle .ir-dot { display: none; }
.ir-toggle::before { content: ""; position: absolute; left: 12px; top: 50%; width: 22px; height: 22px; margin-top: -11px; background: center / contain no-repeat; }
.ir-toggle:focus-visible { outline: 3px solid var(--b-select, #e0512f); outline-offset: 3px; border-radius: 18px; }
/* --- refactor --- */

/* A wavy flower banner with a plumeria pinned at its end */
.ir-refactor {
  position: relative; display: inline-flex; align-items: center; height: 44px; padding: 1px 40px 0 20px; margin-left: 10px;
  border: 0; background: transparent center / 100% 100% no-repeat; color: var(--b-on-coral, #fff); text-shadow: 0 1px 0 var(--b-coral-d, #d9573a);
  font: 600 15px/1 "IR Fredoka", "Trebuchet MS", system-ui, sans-serif; transition: transform .15s;
}
.ir-refactor::after { content: ""; position: absolute; right: -6px; top: 50%; width: 34px; height: 34px; margin-top: -17px; background: center / contain no-repeat; }
.ir-refactor:hover:not(:disabled) { transform: translateY(-2px) rotate(-1.5deg); }
.ir-refactor:active:not(:disabled) { transform: translateY(1px) scale(.98); transition-duration: .05s; }
.ir-refactor:disabled { opacity: .85; }
.ir-refactor:focus-visible { outline: 3px solid var(--b-select, #e0512f); outline-offset: 3px; border-radius: 12px; }
/* --- send --- */

/* Send and its schedule arrow: sea glass pebbles */
.ir-active-box .dC, .ir-active-box .dC * { background-color: transparent !important; border-color: transparent !important; box-shadow: none !important; outline: none !important; }
.ir-active-box .dC .T-I { background: transparent center / 100% 100% no-repeat !important; border: 0 !important; border-radius: 0 !important; margin: 0 !important; transition: transform .15s, filter .15s; }
.ir-active-box .dC .aoO { color: #fff !important; font: 600 15px/1 "IR Fredoka", "Trebuchet MS", system-ui, sans-serif !important; letter-spacing: 0 !important; padding: 0 24px !important; text-shadow: 0 1px 0 var(--b-sea); }
.ir-active-box .dC .hG { margin-left: 3px !important; }
.ir-active-box .dC .hG * { filter: brightness(0) invert(1); }
.ir-active-box .dC .T-I:focus-visible { outline: 3px solid var(--b-select) !important; outline-offset: 2px; }
/* Send reacts: the hovered pebble bobs up and brightens, a press sinks it */
.ir-active-box .dC .T-I:hover { transform: translateY(-2px) rotate(-1.5deg); filter: brightness(1.08) drop-shadow(0 3px 0 var(--b-sea)); }
.ir-active-box .dC .T-I:active { transform: translateY(1px); filter: brightness(.95); transition-duration: .05s; }
/* --- icons --- */

/* Beach glyphs on petal shapes (glyphs per palette in variantCss) */

.ir-active-box [data-ir-icon] { position: relative; background-image: none !important; }
.ir-active-box [data-ir-icon] > * { opacity: 0 !important; }
.ir-active-box [data-ir-icon]:hover { background-color: transparent !important; }
.ir-active-box [data-ir-icon]::before { content: ""; position: absolute; pointer-events: none; }
.ir-active-box [data-ir-icon]::after { content: ""; position: absolute; left: 50%; top: 50%; width: 21px; height: 21px;
  margin: -10.5px 0 0 -10.5px; background: center / contain no-repeat; pointer-events: none; }
.ir-active-box [data-ir-icon]::before { inset: 2px; background: var(--b-lt-soft); border-radius: 62% 38% 62% 38% / 62% 38% 62% 38%; transition: background .12s; }
.ir-active-box [data-ir-icon]:hover::before { background: var(--b-flower2); }
.ir-active-box [data-ir-icon]::after { transition: transform .15s; }
.ir-active-box [data-ir-icon]:hover::after { transform: translateY(-2px) rotate(-8deg) scale(1.1); }
.ir-active-box [data-ir-icon]:active::after { transform: scale(.94); transition-duration: .05s; }
/* --- discard --- */

/* A sand pail, 30% bigger, still the last button */
.ir-active-box [data-ir-icon="trash"] { transform: scale(1.3); margin: 0 6px 0 8px; }
/* --- avatar --- */

/* The user's avatar wears a flower crown (placed by the ornament) and a leaf ring (per palette) */
.ir-crown { position: absolute; z-index: 5; width: 64px; height: 36px; background: center / contain no-repeat; transform: rotate(-8deg); pointer-events: none; }
/* --- caret --- */

/* Coral, like the Refactor banner */
.ir-active-box [contenteditable="true"][role="textbox"] { caret-color: var(--b-coral); }
/* --- cursor --- */

/* A sea glass arrow, a coral arrow with a plumeria over anything clickable, and a coral I-beam with a
   plumeria (in lagoon colours here, per palette in variantCss) */

.ir-active-box, .ir-active-box * { cursor: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2232%22%20height%3D%2232%22%20viewBox%3D%220%200%2032%2032%22%3E%3Cpath%20d%3D%22M5%203.5v19.5c0%201.2%201.3%201.7%202.2.9l4-3.7%203.2%207c.4.9%201.4%201.2%202.2.8l1.3-.6c.8-.4%201.2-1.4.8-2.2l-3.2-6.9h5.6c1.2%200%201.8-1.4.9-2.2L7.3%202.6C6.4%201.8%205%202.3%205%203.5z%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%224%22%20stroke-linejoin%3D%22round%22%2F%3E%3Cpath%20d%3D%22M5%203.5v19.5c0%201.2%201.3%201.7%202.2.9l4-3.7%203.2%207c.4.9%201.4%201.2%202.2.8l1.3-.6c.8-.4%201.2-1.4.8-2.2l-3.2-6.9h5.6c1.2%200%201.8-1.4.9-2.2L7.3%202.6C6.4%201.8%205%202.3%205%203.5z%22%20fill%3D%22%2319b3c9%22%20stroke%3D%22%230b6fa4%22%20stroke-width%3D%221.5%22%20stroke-linejoin%3D%22round%22%2F%3E%3Cpath%20d%3D%22M7.5%207v7%22%20stroke%3D%22%23fff%22%20stroke-width%3D%221.8%22%20stroke-linecap%3D%22round%22%20opacity%3D%22.7%22%2F%3E%3C%2Fsvg%3E") 5 3, default; }
.ir-active-box [role="button"], .ir-active-box button:not(:disabled), .ir-active-box a, .ir-active-box [role="link"], .ir-active-box [role="option"], .ir-active-box [role="listbox"], .ir-active-box [data-ir-icon], .ir-active-box .ir-pin { cursor: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2232%22%20height%3D%2232%22%20viewBox%3D%220%200%2032%2032%22%3E%3Cpath%20d%3D%22M5%203.5v19.5c0%201.2%201.3%201.7%202.2.9l4-3.7%203.2%207c.4.9%201.4%201.2%202.2.8l1.3-.6c.8-.4%201.2-1.4.8-2.2l-3.2-6.9h5.6c1.2%200%201.8-1.4.9-2.2L7.3%202.6C6.4%201.8%205%202.3%205%203.5z%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%224%22%20stroke-linejoin%3D%22round%22%2F%3E%3Cpath%20d%3D%22M5%203.5v19.5c0%201.2%201.3%201.7%202.2.9l4-3.7%203.2%207c.4.9%201.4%201.2%202.2.8l1.3-.6c.8-.4%201.2-1.4.8-2.2l-3.2-6.9h5.6c1.2%200%201.8-1.4.9-2.2L7.3%202.6C6.4%201.8%205%202.3%205%203.5z%22%20fill%3D%22%23e0512f%22%20stroke%3D%22%23d9573a%22%20stroke-width%3D%221.5%22%20stroke-linejoin%3D%22round%22%2F%3E%3Cellipse%20cx%3D%2221%22%20cy%3D%2221.36%22%20rx%3D%222.52%22%20ry%3D%223.64%22%20transform%3D%22rotate(0%2021%2025)%22%20fill%3D%22%23fff8ea%22%20stroke%3D%22%23ff7a59%22%20stroke-width%3D%221%22%2F%3E%3Cellipse%20cx%3D%2221%22%20cy%3D%2221.36%22%20rx%3D%222.52%22%20ry%3D%223.64%22%20transform%3D%22rotate(72%2021%2025)%22%20fill%3D%22%23fff8ea%22%20stroke%3D%22%23ff7a59%22%20stroke-width%3D%221%22%2F%3E%3Cellipse%20cx%3D%2221%22%20cy%3D%2221.36%22%20rx%3D%222.52%22%20ry%3D%223.64%22%20transform%3D%22rotate(144%2021%2025)%22%20fill%3D%22%23fff8ea%22%20stroke%3D%22%23ff7a59%22%20stroke-width%3D%221%22%2F%3E%3Cellipse%20cx%3D%2221%22%20cy%3D%2221.36%22%20rx%3D%222.52%22%20ry%3D%223.64%22%20transform%3D%22rotate(216%2021%2025)%22%20fill%3D%22%23fff8ea%22%20stroke%3D%22%23ff7a59%22%20stroke-width%3D%221%22%2F%3E%3Cellipse%20cx%3D%2221%22%20cy%3D%2221.36%22%20rx%3D%222.52%22%20ry%3D%223.64%22%20transform%3D%22rotate(288%2021%2025)%22%20fill% .ir-active-box input, .ir-active-box textarea, .ir-active-box [contenteditable="true"][role="textbox"] { cursor: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2228%22%20height%3D%2228%22%20viewBox%3D%220%200%2028%2028%22%3E%3Cpath%20d%3D%22M9%204h10M9%2024h10M14%204v20%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%226%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M9%204h10M9%2024h10M14%204v20%22%20fill%3D%22none%22%20stroke%3D%22%23e0512f%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22%2F%3E%3Cellipse%20cx%3D%2222%22%20cy%3D%223.4%22%20rx%3D%221.7999999999999998%22%20ry%3D%222.6%22%20transform%3D%22rotate(0%2022%206)%22%20fill%3D%22%23fff8ea%22%20stroke%3D%22%23ff7a59%22%20stroke-width%3D%221%22%2F%3E%3Cellipse%20cx%3D%2222%22%20cy%3D%223.4%22%20rx%3D%221.7999999999999998%22%20ry%3D%222.6%22%20transform%3D%22rotate(72%2022%206)%22%20fill%3D%22%23fff8ea%22%20stroke%3D%22%23ff7a59%22%20stroke-width%3D%221%22%2F%3E%3Cellipse%20cx%3D%2222%22%20cy%3D%223.4%22%20rx%3D%221.7999999999999998%22%20ry%3D%222.6%22%20transform%3D%22rotate(144%2022%206)%22%20fill%3D%22%23fff8ea%22%20stroke%3D%22%23ff7a59%22%20stroke-width%3D%221%22%2F%3E%3Cellipse%20cx%3D%2222%22%20cy%3D%223.4%22%20rx%3D%221.7999999999999998%22%20ry%3D%222.6%22%20transform%3D%22rotate(216%2022%206)%22%20fill%3D%22%23fff8ea%22%20stroke%3D%22%23ff7a59%22%20stroke-width%3D%221%22%2F%3E%3Cellipse%20cx%3D%2222%22%20cy%3D%223.4%22%20rx%3D%221.7999999999999998%22%20ry%3D%222.6%22%20transform%3D%22rotate(288%2022%206)%22%20fill%3D%22%23fff8ea%22%20stroke%3D%22%23ff7a59%22%20stroke-width%3D%221%22%2F%3E%3Ccircle%20cx%3D%2222%22%20cy%3D%226%22%20r%3D%221.3%22%20fill%3D%22%23ffd23f%22%2F%3E%3C%2Fsvg%3E") 14 14, text; }
.ir-active-box [contenteditable="true"][role="textbox"] * { cursor: inherit; }
/* --- selection --- */

/* The palette's strong select colour (a deep coral, amber at night) under white text: clear on white and
   on dark cards, and apart from the blue comment wash */
.ir-active-box [contenteditable="true"][role="textbox"] ::selection, .ir-active-box [contenteditable="true"][role="textbox"]::selection { background: var(--b-select); color: #fff; }
/* --- comments --- */

/* A soft lagoon blue wash with a straight blue underline (never red or wavy, which would read as a
   mistake), a blue petal pin with its number at the end, and a rounded note card with a leaf edge. */
::highlight(ir-comment) { background-color: rgba(25, 150, 220, .14); text-decoration: underline 2px #1a8fd6; text-underline-offset: 4px; }
.ir-pin { min-width: 20px; height: 20px; padding: 0 5px; border: 2px solid #fff; border-radius: 62% 38% 62% 38% / 62% 38% 62% 38%;
  background: #1a8fd6; color: #fff; font: 600 11px/16px "IR Fredoka", "Trebuchet MS", system-ui, sans-serif; box-shadow: 0 2px 0 #0f6aa3; transition: transform .15s; }
.ir-pin:hover { transform: translateY(-2px) rotate(-8deg) scale(1.12); }
.ir-pin.ir-stale { background: #9aa7a4; box-shadow: none; }
.ir-note { padding: 10px 12px; background: #fff; color: var(--b-ink, #1d2a30);
  border: 2px solid var(--b-leaf, #3f8f5a); border-radius: 18px; box-shadow: 0 6px 18px rgba(0, 60, 70, .18); }
.ir-note-hint { font: 600 11px/1 "IR Fredoka", "Trebuchet MS", system-ui, sans-serif; opacity: .6; }
.ir-note-delete { border: 0; border-radius: 999px; background: var(--b-flower2, #ffd9cf); color: var(--b-ink, #1d2a30); font: 600 12px/1 "IR Fredoka", "Trebuchet MS", system-ui, sans-serif; padding: 5px 10px; }
/* --- swoosh --- */

/* Before: small waves lap at the top of the writing area (a canvas). During and after: the wave's
   layers laid over the writing area: sand, the new text, the old text, the water. */
.ir-beach-layer { position: absolute; pointer-events: none; box-sizing: border-box; overflow: hidden; }
.ir-beach-sand { z-index: 6; }
.ir-beach-text { z-index: 7; background: transparent; }
.ir-beach-water, .ir-beach-ripple { z-index: 8; }
/* --- variant lagoon --- */
