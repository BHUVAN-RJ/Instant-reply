<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FragPunk mockup</title>
<!-- Snapshot of the shipped FragPunk theme (npm run mockup:snapshot -- fragpunk). To change the theme,
     add an option with your changes next to "current", compare, get approval, then port it to the pack.
     The Refactor animation is the theme's own code: run it in the preview (npm run preview). -->
<link rel="stylesheet" href="../kit/mockup-kit.css">
<style id="theme-current">
@font-face { font-family: "IR Marker"; src: url("../../../apps/extension/public/fonts/permanent-marker.woff2") format("woff2"); font-display: swap; }

.ir-active-box { position: relative; isolation: isolate; }
/* The card's own background, radius and shadow are cleared; the skin behind it draws the edge. */
.ir-active-box [data-ir-card] { border-radius: 0 !important; box-shadow: none !important; background: transparent !important; border-color: transparent !important; }
.ir-skin { position: absolute; z-index: -1; pointer-events: none; }
/* In a window the skin fills the box and must not spill past it: Gmail's window scrolls, and anything
   sticking out would add a scrollbar. */
.ir-active-box[data-ir-layout="window"] > .ir-skin { overflow: hidden; }
.ir-toggle-cell { vertical-align: middle; padding: 0 10px 0 6px; white-space: nowrap; }
.ir-toggle, .ir-refactor { cursor: pointer; white-space: nowrap; vertical-align: middle; }
.ir-refactor:disabled { cursor: progress; }
.ir-busy { pointer-events: none; }
.ir-pin { position: absolute; z-index: 9; cursor: pointer; }
.ir-note { position: absolute; z-index: 10; width: 290px; box-sizing: border-box; }
.ir-note textarea { display: block; width: 100%; box-sizing: border-box; border: 0; outline: 0; resize: none; background: transparent; color: inherit; font: 14px/1.4 system-ui, sans-serif; }
.ir-note-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px; }
.ir-note-delete { cursor: pointer; }
.ir-note-delete[hidden] { display: none; }

/* --- tokens --- */

/* Ink edges on light cards, paper edges on dark ones */
[data-ir-theme] { --ir-edge: #0d0b12; --ir-paper: #fff; }
[data-ir-theme="dark"] { --ir-edge: #f4f0fa; }
/* --- card --- */

/* An edge in --ir-edge, an acid sheet peeking out on the left, a magenta hard shadow on the right, torn
   right edge, jagged straight bottom. The skin is sized to the card by gmail.ts. */
.ir-active-box .aDj { border-radius: 0 !important; }
.ir-skin > i { position: absolute; inset: -3px; clip-path: polygon(0 0, calc(100% - 0px) 0%, calc(100% - 2px) 6%, calc(100% - 0px) 13%, calc(100% - 4px) 21%, calc(100% - 1px) 28%, calc(100% - 3px) 36%, calc(100% - 0px) 44%, calc(100% - 5px) 52%, calc(100% - 1px) 60%, calc(100% - 3px) 67%, calc(100% - 0px) 75%, calc(100% - 4px) 83%, calc(100% - 1px) 91%, calc(100% - 2px) 100%, 88% calc(100% - 1px), 76% calc(100% - 4px), 63% calc(100% - 0px), 51% calc(100% - 3px), 38% calc(100% - 1px), 26% calc(100% - 4px), 13% calc(100% - 0px), 1% calc(100% - 3px), 0 calc(100% - 1px)); }
.ir-skin .ir-sh { background: #ff2e88; transform: translate(8px, 7px); }
.ir-skin .ir-under { background: #e6ff1f; transform: translate(-7px, -4px) rotate(.9deg); }
.ir-skin .ir-ink { background: var(--ir-edge); }
.ir-skin .ir-paper { inset: 0; background: var(--ir-paper); }
/* --- head --- */

/* A crooked ink bar behind the recipients line, sticking out past both sides, torn right end, magenta hard
   shadow. It tilts down on the right, so the left, where the caret starts, stays clear. The line's text
   and icons turn light on it. */
.ir-skin > b { position: absolute; top: 0; left: -10px; right: -12px; height: var(--ir-head, 0px); transform: rotate(.9deg);
  clip-path: polygon(0 0, 100% 6%, 98.6% 50%, 100% 100%, 0 100%, .8% 50%); }
/* An acid slab behind the bar, tilted with it and peeking out above and below, so the bar reads as
   stuck on at an angle rather than a crooked line against the card's straight top edge. */
.ir-skin .ir-bar-acid { top: -12px; left: -14px; right: -22px; height: calc(var(--ir-head, 0px) + 18px); background: #e6ff1f; }
.ir-skin .ir-bar-sh { background: #ff2e88; translate: 5px 5px; }
.ir-skin .ir-bar { background: #0d0b12; }
.ir-active-box:not([data-ir-layout="window"])[data-ir-head-style="band"] [data-ir-head], .ir-active-box:not([data-ir-layout="window"])[data-ir-head-style="band"] [data-ir-head] * { color: #fff !important; background-color: transparent !important; }
.ir-active-box:not([data-ir-layout="window"])[data-ir-head-style="band"] [data-ir-head] [role="button"], .ir-active-box:not([data-ir-layout="window"])[data-ir-head-style="band"] [data-ir-head] img { filter: brightness(0) invert(1) !important; opacity: 1 !important; }
.ir-active-box:not([data-ir-layout="window"])[data-ir-head-style="band"] [data-ir-head] [role="button"] img { filter: none !important; }
/* Without the band (the default, and always in a window under Subject): the To line stays plain and the
   same bar shrinks to a crooked 5px ink rule with a magenta hard shadow between it and the body. */
.ir-active-box[data-ir-head-style="rule"] > .ir-skin > b { top: calc(var(--ir-head, 0px) - 4px); left: 0; right: 0; height: 5px; transform: rotate(-.35deg); clip-path: none; }
.ir-active-box[data-ir-head-style="rule"] > .ir-skin .ir-bar-acid { display: none; }
.ir-active-box[data-ir-head-style="rule"] > .ir-skin .ir-bar-sh { translate: 3px 3px; }
/* --- body --- */

/* With the To line band, the acid slab under the bar marks where the writing area starts */
.ir-active-box:not([data-ir-layout="window"])[data-ir-head-style="band"] [data-ir-card] > table.iN { border-top: 6px solid transparent !important; }
/* With the rule, 10px of room between it and the text */
.ir-active-box[data-ir-head-style="rule"] table.iN { border-top: 10px solid transparent !important; }
/* --- formatBar --- */

/* A flat paper strip with an ink edge and a magenta hard shadow, square, slightly tilted; its buttons
   light up acid on hover. */
.ir-active-box .J-Z[role="toolbar"] { border-radius: 0 !important; background: var(--ir-paper) !important; border: 2px solid var(--ir-edge);
  box-shadow: 4px 4px 0 #ff2e88; transform: rotate(-.4deg); }
.ir-active-box .J-Z[role="toolbar"] .J-Z-axR { background: var(--ir-edge) !important; width: 2px !important; }
.ir-active-box .J-Z[role="toolbar"] [role="button"], .ir-active-box .J-Z[role="toolbar"] [role="listbox"] { border-radius: 0 !important; transition: transform .1s; }
.ir-active-box .J-Z[role="toolbar"] [role="button"]:hover, .ir-active-box .J-Z[role="toolbar"] [role="listbox"]:hover,
.ir-active-box .J-Z[role="toolbar"] [aria-pressed="true"] { background-color: #e6ff1f !important; box-shadow: 0 0 0 3px #e6ff1f !important; transform: rotate(-3deg); }
.ir-active-box .J-Z[role="toolbar"] [role="option"] { font: 400 14px/1.4 "IR Marker", "Permanent Marker", "Comic Sans MS", cursive !important; color: var(--ir-edge) !important; }
/* --- pinnedRow --- */

/* When the reply runs past the bottom of the window, Gmail pins the Send row there (.aDj.ahe, fixed) and
   draws it as a rounded white panel over the card, hiding the border's sides and bottom. Pinned, the row
   gets its own copy of the border: ink sides and bottom, acid on the left, the magenta hard shadow. */
.ir-active-box .aDj.ahe { box-shadow: none !important; }
.ir-active-box .aDj.ahe::before { inset: 0 -3px -3px !important; border: 3px solid var(--ir-edge) !important; border-top: 0 !important;
  border-radius: 0 !important; box-shadow: 8px 7px 0 #ff2e88, -7px 4px 0 #e6ff1f !important; }
.ir-active-box .aDj.ahe::after { inset: 0 !important; background: var(--ir-paper) !important; border-radius: 0 !important; }
/* --- window --- */

/* A new email or a popped out reply: Gmail's window is already the frame, so nothing is drawn outside it.
   An acid band runs down the inside left edge; the To and Subject rows stay on paper in Gmail's colours
   (they are form fields) and the head slot's rule underlines them. The switch
   shrinks to its diamond sticker and Refactor tightens, so Gmail keeps room for its toolbar icons. */
.ir-active-box[data-ir-layout="window"] > .ir-skin > i { inset: 0; clip-path: none; transform: none; }
.ir-active-box[data-ir-layout="window"] > .ir-skin .ir-sh, .ir-active-box[data-ir-layout="window"] > .ir-skin .ir-ink { display: none; }
.ir-active-box[data-ir-layout="window"] > .ir-skin .ir-under { right: auto; width: 6px; background: #e6ff1f; }
.ir-active-box[data-ir-layout="window"] > .ir-skin .ir-paper { left: 6px; }
.ir-active-box[data-ir-layout="window"] .ir-toggle { width: 34px; padding: 0; gap: 0; justify-content: center; font-size: 0; margin-left: 8px; }
.ir-active-box[data-ir-layout="window"] .ir-toggle .ir-dot { width: 11px; height: 11px; }
.ir-active-box[data-ir-layout="window"] .ir-refactor { padding: 2px 11px 0; font-size: 15px; margin-left: 8px; }
/* --- toggle --- */

/* Dashed outline when off, a tilted torn magenta sticker when on */
.ir-toggle {
  display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 2px 13px 0; margin-left: 10px;
  border: 2px dashed var(--ir-edge, #0d0b12); border-radius: 0; background: transparent; color: var(--ir-edge, #0d0b12);
  font: 400 15px/1 "IR Marker", "Permanent Marker", "Comic Sans MS", cursive; opacity: .8; transition: transform .12s, opacity .12s;
}
.ir-toggle:hover { opacity: 1; transform: rotate(-1deg); }
.ir-toggle .ir-dot { width: 8px; height: 8px; border: 2px solid currentColor; transform: rotate(45deg); box-sizing: border-box; }
.ir-toggle[data-active="true"] { opacity: 1; border: 2px solid #0d0b12; background: #ff2e88; color: #fff; transform: rotate(2deg); clip-path: polygon(0 4%, 12% 0, 40% 3%, 70% 0, 100% 5%, 98% 60%, 100% 100%, 60% 96%, 30% 100%, 2% 97%, 0 55%); }
.ir-toggle[data-active="true"] .ir-dot { background: #e6ff1f; border-color: #0d0b12; }
.ir-toggle:focus-visible { outline: 3px solid #ff2e88; outline-offset: 2px; }
/* The torn clip path would cut an outside ring off, so the on sticker draws its focus ring inside */
.ir-toggle[data-active="true"]:focus-visible { outline: 3px solid #e6ff1f; outline-offset: -7px; }
/* --- refactor --- */

/* A tilted torn acid sticker in Permanent Marker */
.ir-refactor {
  display: inline-flex; align-items: center; height: 36px; padding: 2px 16px 0; margin-left: 10px;
  border: 2px solid #0d0b12; border-radius: 0; background: #e6ff1f; color: #0d0b12;
  font: 400 17px/1 "IR Marker", "Permanent Marker", "Comic Sans MS", cursive; transform: rotate(-2deg); clip-path: polygon(0 4%, 12% 0, 40% 3%, 70% 0, 100% 5%, 98% 60%, 100% 100%, 60% 96%, 30% 100%, 2% 97%, 0 55%); transition: transform .12s;
}
.ir-refactor:hover:not(:disabled) { transform: rotate(1deg) scale(1.04); }
.ir-refactor:active:not(:disabled) { transform: rotate(-2deg) translate(2px, 2px) scale(.97); transition-duration: .04s; }
/* The torn clip path would cut an outside ring off, so the focus ring sits inside the sticker */
.ir-refactor:focus-visible { outline: 3px solid #ff2e88; outline-offset: -7px; }
/* --- send --- */

/* Send and its schedule arrow restyled in place: one ink torn sticker split by an acid seam. */
.ir-active-box .dC, .ir-active-box .dC * { background-color: transparent !important; border-color: transparent !important; box-shadow: none !important; outline: none !important; }
.ir-active-box .dC { transform: rotate(-2deg); filter: drop-shadow(3px 3px 0 #e6ff1f); transition: filter .12s; }
.ir-active-box .dC .T-I { background-image: none !important; background-color: #0d0b12 !important; color: #e6ff1f !important; border: 0 !important; border-radius: 0 !important; margin: 0 !important; transition: transform .12s, color .12s; }
.ir-active-box .dC .aoO { font: 400 17px/1 "IR Marker", "Permanent Marker", "Comic Sans MS", cursive !important; letter-spacing: 0 !important; padding: 0 16px !important;
  clip-path: polygon(0 4%, 12% 0, 40% 3%, 70% 0, 100% 2%, 100% 100%, 60% 96%, 30% 100%, 2% 97%, 0 55%); }
.ir-active-box .dC .hG { border-left: 2px solid #e6ff1f !important; clip-path: polygon(0 2%, 60% 0, 100% 6%, 96% 60%, 100% 100%, 50% 96%, 0 100%); }
.ir-active-box .dC .hG * { filter: brightness(0) invert(1) sepia(1) saturate(8) hue-rotate(15deg); }
.ir-active-box .dC .T-I:focus-visible { background-color: #2a2533 !important; }
/* Send reacts: the group's acid shadow grows on hover, the hovered half lifts and lights up, a press stamps it down */
.ir-active-box .dC:hover { filter: drop-shadow(5px 5px 0 #e6ff1f) drop-shadow(-2px -2px 0 #ff2e88); }
.ir-active-box .dC .T-I:hover { transform: translate(-1px, -2px) rotate(-1.5deg); color: #fff !important; }
.ir-active-box .dC .hG:hover * { filter: brightness(0) invert(1); }
.ir-active-box .dC .T-I:active { transform: translate(2px, 2px); transition-duration: .04s; }
/* --- icons --- */

/* FragPunk glyphs; a tilted torn acid block behind them on hover */

.ir-active-box [data-ir-icon] { position: relative; background-image: none !important; }
.ir-active-box [data-ir-icon] > * { opacity: 0 !important; }
.ir-active-box [data-ir-icon]:hover { background-color: transparent !important; }
.ir-active-box [data-ir-icon]::before { content: ""; position: absolute; pointer-events: none; }
.ir-active-box [data-ir-icon]::after { content: ""; position: absolute; left: 50%; top: 50%; width: 21px; height: 21px;
  margin: -10.5px 0 0 -10.5px; background: center / contain no-repeat; pointer-events: none; }
.ir-active-box [data-ir-icon]::before { inset: 1px; background: #e6ff1f; clip-path: polygon(0 4%, 12% 0, 40% 3%, 70% 0, 100% 5%, 98% 60%, 100% 100%, 60% 96%, 30% 100%, 2% 97%, 0 55%); transform: rotate(-4deg); opacity: 0; transition: opacity .1s; }
.ir-active-box [data-ir-icon]:hover::before { opacity: 1; }
.ir-active-box [data-ir-icon]::after { transition: transform .12s; }
.ir-active-box [data-ir-icon]:hover::after { transform: translateY(-1px) rotate(-6deg) scale(1.12); }
.ir-active-box [data-ir-icon]:active::after { transform: scale(.94); transition-duration: .04s; }

/* Cut from a circle into a tilted octagon sticker with hard shadows */
[data-ir-avatar] { border-radius: 0 !important; transform: rotate(-6deg);
  clip-path: polygon(28% 0, 74% 3%, 100% 27%, 97% 73%, 72% 100%, 27% 97%, 0 72%, 3% 28%); }
[data-ir-avatar-wrap] { filter: drop-shadow(3px 3px 0 #ff2e88) drop-shadow(-2px -2px 0 #e6ff1f); }
/* --- caret --- */

/* Magenta, so it is easy to spot */
.ir-active-box [contenteditable="true"][role="textbox"] { caret-color: #ff2e88; }
/* --- cursor --- */

/* Acid arrow, magenta hand, acid I-beam, all with an ink edge and a hard shadow */

.ir-active-box, .ir-active-box * { cursor: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2232%22%20height%3D%2232%22%20viewBox%3D%220%200%2032%2032%22%3E%3Cpath%20transform%3D%22translate(2.5%202.5)%22%20fill%3D%22%23ff2e88%22%20d%3D%22M3%203v21l5.5-5%204%208.5%204-2-4-8H20z%22%2F%3E%3Cpath%20fill%3D%22%23e6ff1f%22%20stroke%3D%22%230d0b12%22%20stroke-width%3D%222%22%20stroke-linejoin%3D%22miter%22%20d%3D%22M3%203v21l5.5-5%204%208.5%204-2-4-8H20z%22%2F%3E%3C%2Fsvg%3E") 3 3, default; }
.ir-active-box [role="button"], .ir-active-box button:not(:disabled), .ir-active-box a, .ir-active-box [role="link"], .ir-active-box [role="option"], .ir-active-box [role="listbox"], .ir-active-box [data-ir-icon], .ir-active-box .ir-pin { cursor: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2232%22%20height%3D%2232%22%20viewBox%3D%220%200%2032%2032%22%3E%3Cpath%20transform%3D%22translate(2.5%202.5)%22%20fill%3D%22%23e6ff1f%22%20d%3D%22M3%203v21l5.5-5%204%208.5%204-2-4-8H20z%22%2F%3E%3Cpath%20fill%3D%22%23ff2e88%22%20stroke%3D%22%230d0b12%22%20stroke-width%3D%222%22%20stroke-linejoin%3D%22miter%22%20d%3D%22M3%203v21l5.5-5%204%208.5%204-2-4-8H20z%22%2F%3E%3C%2Fsvg%3E") 3 3, pointer; }
.ir-active-box input, .ir-active-box textarea, .ir-active-box [contenteditable="true"][role="textbox"] { cursor: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2232%22%20height%3D%2232%22%20viewBox%3D%220%200%2032%2032%22%3E%3Cpath%20transform%3D%22translate(2.5%202.5)%22%20fill%3D%22%23ff2e88%22%20d%3D%22M8%203h14l-2.5%203.5H17v19h2.5L22%2029H8l2.5-3.5H13v-19h-2.5z%22%2F%3E%3Cpath%20fill%3D%22%23e6ff1f%22%20stroke%3D%22%230d0b12%22%20stroke-width%3D%222%22%20stroke-linejoin%3D%22miter%22%20d%3D%22M8%203h14l-2.5%203.5H17v19h2.5L22%2029H8l2.5-3.5H13v-19h-2.5z%22%2F%3E%3C%2Fsvg%3E") 15 16, text; }
.ir-active-box [contenteditable="true"][role="textbox"] * { cursor: inherit; }
/* --- selection --- */

/* Magenta with white text: loud, and apart from the acid comment highlight */
.ir-active-box [contenteditable="true"][role="textbox"] ::selection, .ir-active-box [contenteditable="true"][role="textbox"]::selection { background: #ff2e88; color: #fff; }
/* --- comments --- */

/* The passage gets an acid highlighter streak with a blue underline (never red, which would read as a
   mistake), a torn blue pin with its number sits at its end, and the note box is a tilted paper sticker. */
::highlight(ir-comment) { background-color: rgba(230, 255, 31, .6); text-decoration: underline 2px #2b6cff; text-underline-offset: 3px; }
.ir-pin { min-width: 20px; height: 20px; padding: 2px 5px 0; border: 2px solid #0d0b12; border-radius: 0;
  background: #2b6cff; color: #fff; font: 400 12px/1 "IR Marker", "Permanent Marker", "Comic Sans MS", cursive; clip-path: polygon(0 4%, 12% 0, 40% 3%, 70% 0, 100% 5%, 98% 60%, 100% 100%, 60% 96%, 30% 100%, 2% 97%, 0 55%); transform: rotate(-8deg); transition: transform .12s; }
.ir-pin:hover { transform: rotate(4deg) scale(1.15); }
.ir-pin.ir-stale { background: #8d8a93; }
.ir-note { padding: 8px 10px; background: #fff; color: #0d0b12; border: 2px solid #0d0b12; box-shadow: 5px 5px 0 #ff2e88, -3px -3px 0 #e6ff1f; transform: rotate(-.6deg); }
.ir-note-hint { font: 400 11px/1 "IR Marker", "Permanent Marker", "Comic Sans MS", cursive; opacity: .65; }
.ir-note-delete { border: 2px solid #0d0b12; background: #e6ff1f; color: #0d0b12; font: 400 12px/1 "IR Marker", "Permanent Marker", "Comic Sans MS", cursive; padding: 3px 8px 1px; }
/* --- swoosh --- */

/* Before: the old text flickers out of register */
.ir-glitch { animation: ir-flicker .3s steps(3) infinite; }
@keyframes ir-flicker {
  33% { transform: translateX(-2px); text-shadow: 2px 0 #ff2e88; }
  66% { transform: translateX(2px); text-shadow: -2px 0 #c8e600; }
}

/* During: the sweep overlay */
.ir-ghost { position: absolute; z-index: 6; box-sizing: border-box; overflow: hidden; background: var(--ir-paper, #fff); pointer-events: none;
  text-shadow: -2px 0 rgba(255,46,136,.8), 2px 0 rgba(200,230,0,.9); }
.ir-sweep { position: absolute; z-index: 7; pointer-events: none; }

/* After: the box shakes on impact; with the New mark, the New! stamp slams in, its top right corner
   curls and lets go, it swings from the top left and drops */
@property --ir-fold { syntax: "<length>"; inherits: true; initial-value: 0px; }
.ir-stamp { position: absolute; z-index: 8; pointer-events: none; animation: ir-stamp-in 3.2s forwards; }
.ir-sheet { position: relative; transform-origin: 6px 6px; --ir-fold: 0px; animation: ir-poster 3.2s forwards, ir-curl 3.2s forwards; }
.ir-sheet-shadow, .ir-face { clip-path: polygon(0 5%, 10% 0, 42% 4%, calc(100% - var(--ir-fold)) 0, 100% calc(6% + var(--ir-fold)), 98% 58%, 100% 100%, 60% 95%, 28% 100%, 2% 96%, 0 52%); }
.ir-sheet-shadow { position: absolute; inset: 0; transform: translate(5px, 5px); background: #ff2e88; }
.ir-face { position: relative; padding: 10px 22px 6px; background: #e6ff1f; color: #0d0b12; border: 3px solid #0d0b12; font: 400 32px/1 "IR Marker", "Permanent Marker", "Comic Sans MS", cursive; white-space: nowrap; }
.ir-face::after { content: ""; position: absolute; top: -3px; right: -3px; width: var(--ir-fold); height: var(--ir-fold); background: linear-gradient(45deg, #9fb000, #c8e000); clip-path: polygon(0 0, 100% 100%, 0 100%); }
.ir-face::before { content: ""; position: absolute; top: -3px; right: -3px; z-index: 1; width: var(--ir-fold); height: var(--ir-fold);
  background: linear-gradient(to top right, transparent calc(50% - 1.5px), #0d0b12 calc(50% - 1.5px), #0d0b12 calc(50% + 1.5px), transparent calc(50% + 1.5px)); }
@keyframes ir-stamp-in {
  0% { opacity: 0; transform: rotate(-7deg) scale(2.8); animation-timing-function: cubic-bezier(.6,0,1,.6); }
  7%, 100% { opacity: 1; transform: rotate(-7deg) scale(1); }
}
@keyframes ir-curl { 0%, 38% { --ir-fold: 0px; } 50% { --ir-fold: 26px; } 56%, 100% { --ir-fold: 34px; } }
@keyframes ir-poster {
  0%, 50% { transform: rotate(0); opacity: 1; animation-timing-function: cubic-bezier(.5,0,.7,1); }
  58% { transform: rotate(24deg); animation-timing-function: ease-out; }
  63% { transform: rotate(15deg); animation-timing-function: ease-in-out; }
  68% { transform: rotate(21deg); animation-timing-function: ease-in-out; }
  73% { transform: rotate(18deg) translateY(0); opacity: 1; animation-timing-function: cubic-bezier(.55,0,.95,.45); }
  100% { transform: rotate(46deg) translate(40px, 330px); opacity: 0; }
}
.ir-shake { animation: ir-slam .26s linear; }
@keyframes ir-slam { 20% { transform: translate(-4px, 2px); } 40% { transform: translate(4px, -2px); } 60% { transform: translate(-2px, 1px); } 80% { transform: translate(2px, 0); } }
/* --- variant ink --- */
/* plain: one variant; light and dark cards are handled by the tokens slot */

@media (prefers-reduced-motion: reduce) {

    animation: none !important; transition: none !important;
  }
}
